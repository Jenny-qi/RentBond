# Local/self-hosted scanner. Keep this unauthenticated protocol on loopback.
# Use rentbond-clamd.service (TZ=UTC) for unambiguous VERSION dates.
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
DatabaseDirectory /var/lib/clamav
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 1000
MaxThreads 2
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 1000
AlertExceedsMax yes
SelfCheck 300
LogTime yes
Foreground yes
