# Container-private TCP only. No host port is published for this service.
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 1000
MaxThreads 2
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 1000
AlertExceedsMax yes
SelfCheck 300
LogTime yes
Foreground yes
