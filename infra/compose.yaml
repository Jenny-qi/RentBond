services:
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: rentbond
      POSTGRES_USER: rentbond
      POSTGRES_PASSWORD: ${RENTBOND_DB_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - rentbond-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentbond -d rentbond"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rentbond-postgres:
