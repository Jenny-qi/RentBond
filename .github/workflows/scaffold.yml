name: Scaffold checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scaffold:
    name: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: node scripts/doctor.mjs
      - run: node scripts/check-scaffold.mjs
      # Frontend typecheck/tests/build are in frontend.yml.
      # Full contracts/backend/chain integration remain RB-02/RB-13 work.
