name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'

jobs:
  doctor:
    name: Environment check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/doctor.mjs

  check-scaffold:
    name: Scaffold integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-scaffold.mjs
      - run: node --test scripts/verify-monad-evidence.test.mjs
      - run: node --test scripts/attest-monad-deployment.test.mjs

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix apps/web --no-audit --no-fund
        env:
          NPM_CONFIG_AUDIT: false
      - run: npm ci --prefix packages/shared --no-audit --no-fund
      - run: npm run typecheck --prefix apps/web

  test-contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run build:contracts
      - run: npm run test:contracts
      - run: npm run check:contract-sizes

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - run: npm ci --prefix packages/shared --no-audit --no-fund
      - run: npm run backend:abi --prefix apps/web
      - run: |
          set +e
          node tests/runner.mjs integration --only=IT-01,IT-02,IT-07,IT-08,IT-09
          code=$?
          # Exit 2 = all skipped (RB-xx not met) — not a CI failure
          [ $code -eq 2 ] && exit 0 || exit $code

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          set +e
          node tests/runner.mjs e2e
          code=$?
          # Exit 2 = all skipped (RB-xx not met) — not a CI failure
          [ $code -eq 2 ] && exit 0 || exit $code
