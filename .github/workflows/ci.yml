name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '12.8.1'

jobs:
  doctor:
    name: Environment check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --allow-build=esbuild --allow-build=core-js
      - run: node scripts/doctor.mjs

  check-scaffold:
    name: Scaffold integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --allow-build=esbuild --allow-build=core-js
      - run: node scripts/check-scaffold.mjs
      - run: node --test scripts/verify-monad-evidence.test.mjs
      - run: node --test scripts/attest-monad-deployment.test.mjs
      - run: node apps/worker/src/indexer/providers.test.mjs

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --allow-build=esbuild --allow-build=core-js
      - run: pnpm --filter @rentbond/web run typecheck

  test-contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --allow-build=esbuild --allow-build=core-js
      - run: pnpm run build:contracts
      - run: pnpm run test:contracts
      - run: pnpm run check:contract-sizes

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --allow-build=esbuild --allow-build=core-js
      - run: pnpm --filter @rentbond/web run test
      - run: pnpm --filter @rentbond/web run backend:abi
      - run: node tests/runner.mjs integration

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --allow-build=esbuild --allow-build=core-js
      - run: node tests/runner.mjs e2e
