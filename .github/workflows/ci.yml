name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'

jobs:
  doctor:
    name: Environment check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/doctor.mjs

  check-scaffold:
    name: Scaffold integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-scaffold.mjs
      - run: node --test scripts/verify-monad-evidence.test.mjs

  typecheck:
    name: Type check
    if: ${{ false }} # Enable with RB-02 when app dependencies and lockfile exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_AUDIT: false
      - run: pnpm typecheck
        # Implemented by RB-02; until then prints a clear not-implemented error

  test-contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run build:contracts
      - run: npm run test:contracts
      - run: npm run check:contract-sizes

  test-integration:
    name: Integration tests
    if: ${{ false }} # Enable with RB-12.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tests/runner.mjs integration
        # Runs after RB-12

  test-e2e:
    name: E2E tests
    if: ${{ false }} # Enable with RB-12/RB-13.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tests/runner.mjs e2e
        # Runs after RB-12/RB-13
