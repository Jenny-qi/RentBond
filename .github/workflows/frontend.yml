name: Frontend checks
on:
  push:
    branches: [main, feat/RB-08-member-c-frontend]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @rentbond/web exec playwright install --with-deps chromium
      - run: pnpm test:web:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: apps/web/test-results/
          retention-days: 7
